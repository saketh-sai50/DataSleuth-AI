[project]
name = "idaa-backend"
version = "0.1.0"
description = "Investigative Data Analyst Agent Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "sqlalchemy>=2.0.31",
    "pandas>=2.2.2",
    "duckdb>=1.0.0",
    "plotly>=5.22.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.1.4",
    "langchain-core>=0.2.9",
    "langchain-openai>=0.1.8",
    "openpyxl>=3.1.5",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=24.4.2",
    "isort>=5.13.2",
    "mypy>=1.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
